server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # routing Angular: ogni path non trovato torna a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # proxy delle chiamate API verso il backend
    location /api/ {
        proxy_pass http://backend:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # proxy per le immagini caricate
    location /uploads/ {
        proxy_pass http://backend:3005;
        proxy_set_header Host $host;
    }
}
